# ============================================================================
# Outputs
# ============================================================================

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub ${Environment}-VitalMatch-VPC-ID

  PublicSubnetAId:
    Description: Public Subnet A ID
    Value: !Ref PublicSubnetA
    Export:
      Name: !Sub ${Environment}-VitalMatch-PublicSubnetA-ID

  PublicSubnetBId:
    Description: Public Subnet B ID
    Value: !Ref PublicSubnetB
    Export:
      Name: !Sub ${Environment}-VitalMatch-PublicSubnetB-ID

  PrivateSubnetAId:
    Description: Private Subnet A ID
    Value: !Ref PrivateSubnetA
    Export:
      Name: !Sub ${Environment}-VitalMatch-PrivateSubnetA-ID

  PrivateSubnetBId:
    Description: Private Subnet B ID
    Value: !Ref PrivateSubnetB
    Export:
      Name: !Sub ${Environment}-VitalMatch-PrivateSubnetB-ID

  LambdaSecurityGroupId:
    Description: Lambda Security Group ID
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub ${Environment}-VitalMatch-Lambda-SG-ID

  RDSSecurityGroupId:
    Description: RDS Security Group ID
    Value: !Ref RDSSecurityGroup
    Export:
      Name: !Sub ${Environment}-VitalMatch-RDS-SG-ID

  AuroraClusterEndpoint:
    Description: Aurora Serverless v2 cluster endpoint
    Value: !GetAtt AuroraCluster.Endpoint.Address
    Export:
      Name: !Sub ${Environment}-VitalMatch-Aurora-Endpoint

  AuroraReaderEndpoint:
    Description: Aurora Serverless v2 reader endpoint
    Value: !GetAtt AuroraCluster.ReadEndpoint.Address
    Export:
      Name: !Sub ${Environment}-VitalMatch-Aurora-Reader-Endpoint

  DBSecretArn:
    Description: ARN of the database credentials secret
    Value: !Ref DBSecret
    Export:
      Name: !Sub ${Environment}-VitalMatch-DB-Secret-ARN

  SystemAlertTopicArn:
    Description: SNS Topic ARN for system alerts
    Value: !Ref SystemAlertTopic
    Export:
      Name: !Sub ${Environment}-VitalMatch-System-Alert-Topic-ARN

  DataIngestionFunctionArn:
    Description: Data Ingestion Lambda Function ARN
    Value: !GetAtt DataIngestionFunction.Arn
    Export:
      Name: !Sub ${Environment}-VitalMatch-DataIngestion-Function-ARN

  DataIngestionFunctionName:
    Description: Data Ingestion Lambda Function Name
    Value: !Ref DataIngestionFunction
    Export:
      Name: !Sub ${Environment}-VitalMatch-DataIngestion-Function-Name

  MatchTrialsFunctionArn:
    Description: Match Trials Lambda Function ARN
    Value: !GetAtt MatchTrialsFunction.Arn
    Export:
      Name: !Sub ${Environment}-VitalMatch-MatchTrials-Function-ARN

  MatchTrialsFunctionName:
    Description: Match Trials Lambda Function Name
    Value: !Ref MatchTrialsFunction
    Export:
      Name: !Sub ${Environment}-VitalMatch-MatchTrials-Function-Name

  ApiGatewayId:
    Description: API Gateway REST API ID
    Value: !Ref TrialMatcherAPI
    Export:
      Name: !Sub ${Environment}-VitalMatch-API-ID

  ApiGatewayRootResourceId:
    Description: API Gateway Root Resource ID
    Value: !GetAtt TrialMatcherAPI.RootResourceId
    Export:
      Name: !Sub ${Environment}-VitalMatch-API-RootResourceId

  DevStageUrl:
    Description: API Gateway Dev Stage URL
    Value: !Sub https://${TrialMatcherAPI}.execute-api.${AWS::Region}.amazonaws.com/dev
    Export:
      Name: !Sub ${Environment}-VitalMatch-API-Dev-URL

  StagingStageUrl:
    Description: API Gateway Staging Stage URL
    Value: !Sub https://${TrialMatcherAPI}.execute-api.${AWS::Region}.amazonaws.com/staging
    Export:
      Name: !Sub ${Environment}-VitalMatch-API-Staging-URL

  ProdStageUrl:
    Description: API Gateway Production Stage URL
    Value: !Sub https://${TrialMatcherAPI}.execute-api.${AWS::Region}.amazonaws.com/prod
    Export:
      Name: !Sub ${Environment}-VitalMatch-API-Prod-URL

  ApiEndpoint:
    Description: API Gateway endpoint URL for current environment
    Value: !Sub https://${TrialMatcherAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ${Environment}-VitalMatch-API-Endpoint

  FrontendBucketName:
    Description: S3 bucket name for frontend static website
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub ${Environment}-VitalMatch-Frontend-Bucket-Name

  FrontendBucketArn:
    Description: S3 bucket ARN for frontend static website
    Value: !GetAtt FrontendBucket.Arn
    Export:
      Name: !Sub ${Environment}-VitalMatch-Frontend-Bucket-ARN

  FrontendWebsiteURL:
    Description: S3 static website URL
    Value: !GetAtt FrontendBucket.WebsiteURL
    Export:
      Name: !Sub ${Environment}-VitalMatch-Frontend-Website-URL

  FrontendBucketDomainName:
    Description: S3 bucket domain name for CloudFront origin
    Value: !GetAtt FrontendBucket.DomainName
    Export:
      Name: !Sub ${Environment}-VitalMatch-Frontend-Bucket-DomainName

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub ${Environment}-VitalMatch-CloudFront-Distribution-ID

  CloudFrontDistributionDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub ${Environment}-VitalMatch-CloudFront-Domain-Name

  CloudFrontURL:
    Description: CloudFront Distribution URL (primary frontend access point)
    Value: !Sub https://${CloudFrontDistribution.DomainName}
    Export:
      Name: !Sub ${Environment}-VitalMatch-CloudFront-URL

  CloudFrontLogsBucketName:
    Description: S3 bucket name for CloudFront access logs
    Value: !Ref CloudFrontLogsBucket
    Export:
      Name: !Sub ${Environment}-VitalMatch-CloudFront-Logs-Bucket-Name
