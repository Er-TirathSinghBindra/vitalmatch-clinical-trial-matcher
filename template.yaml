AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: VitalMatch Clinical Trial Matcher - AWS Infrastructure

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name for resource naming and configuration

  DBUsername:
    Type: String
    Default: vitalmatch_admin
    Description: Database master username
    NoEcho: true

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  # ============================================================================
  # VPC and Network Configuration (Task 1.1)
  # ============================================================================
  
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-vpc
        - Key: Environment
          Value: !Ref Environment

  # Internet Gateway for NAT Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnet for NAT Gateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-public-subnet-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-public-subnet-b

  # Private Subnets for Lambda and RDS
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-private-subnet-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-private-subnet-b

  # NAT Gateway removed - using hybrid Lambda approach
  # Data Ingestion Lambda runs outside VPC (has internet access)
  # Match Trials Lambda runs inside VPC (RDS access only)

  # Route Tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-private-rt

  # Private route removed - no NAT Gateway needed
  # Lambda functions that need internet access run outside VPC

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # Security Groups
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${Environment}-vitalmatch-lambda-sg
      GroupDescription: Security group for Lambda functions
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow HTTPS for external API calls
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-lambda-sg

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${Environment}-vitalmatch-rds-sg
      GroupDescription: Security group for RDS database
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: Allow PostgreSQL access from VPC Lambda
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
          Description: Allow PostgreSQL access from Data Ingestion Lambda (outside VPC with IAM auth)
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-rds-sg

  # Security Group Egress Rule for Lambda to RDS (breaks circular dependency)
  LambdaToRDSEgressRule:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref RDSSecurityGroup
      Description: Allow PostgreSQL access to RDS

  # ============================================================================
  # RDS PostgreSQL Database with RDS Proxy (Task 1.2)
  # ============================================================================

  # Database Subnet Group
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub ${Environment}-vitalmatch-db-subnet-group
      DBSubnetGroupDescription: Subnet group for VitalMatch RDS database
      SubnetIds:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-db-subnet-group

  # Aurora Serverless v2 Cluster
  AuroraCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBClusterIdentifier: !Sub ${Environment}-vitalmatch-aurora
      Engine: aurora-postgresql
      EngineVersion: '17.5'
      DatabaseName: trials_db
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref RDSSecurityGroup
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 1.0
      StorageEncrypted: true
      # No KmsKeyId = AWS-managed encryption
      EnableCloudwatchLogsExports:
        - postgresql
      BackupRetentionPeriod: 7
      PreferredBackupWindow: '03:00-04:00'
      PreferredMaintenanceWindow: 'sun:04:00-sun:05:00'
      EnableIAMDatabaseAuthentication: true
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-aurora
        - Key: Environment
          Value: !Ref Environment

  # Aurora Serverless v2 Instance
  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub ${Environment}-vitalmatch-aurora-instance
      Engine: aurora-postgresql
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      PubliclyAccessible: true
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-aurora-instance
        - Key: Environment
          Value: !Ref Environment

  # Secrets Manager Secret for Database Credentials (created first with auto-generated password)
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${Environment}/vitalmatch/db-credentials
      Description: Database credentials for VitalMatch
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${DBUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
        RequireEachIncludedType: true
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-db-secret
        - Key: Environment
          Value: !Ref Environment

  # Store database credentials in Parameter Store (for backward compatibility)
  DBUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Environment}/vitalmatch/db/username
      Type: String
      Value: !Ref DBUsername
      Description: Database username for VitalMatch

  DBEndpointParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Environment}/vitalmatch/db/endpoint
      Type: String
      Value: !GetAtt AuroraCluster.Endpoint.Address
      Description: Aurora cluster endpoint for VitalMatch

  # ============================================================================
  # Lambda Functions
  # ============================================================================

  # General SNS Topic for System Alerts
  SystemAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${Environment}-vitalmatch-system-alerts
      DisplayName: VitalMatch System Alerts
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-system-alerts

  # IAM Role for Match Trials Lambda
  MatchTrialsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Environment}-vitalmatch-match-trials-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: MatchTrialsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # RDS Proxy connection
              - Effect: Allow
                Action:
                  - rds-db:connect
                Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:*/*
              # Amazon Bedrock for AI matching
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'
              # Amazon Comprehend Medical (if needed)
              - Effect: Allow
                Action:
                  - comprehendmedical:*
                Resource: '*'
              # CloudWatch metrics
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
              # Secrets Manager (for database credentials)
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DBSecret
              # Parameter Store (for configuration)
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Environment}/vitalmatch/*

  # Match Trials Lambda Function
  MatchTrialsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-vitalmatch-match-trials
      CodeUri: backend/
      Handler: match_trials.lambda_handler
      Runtime: python3.13
      MemorySize: 1024
      Timeout: 30
      Role: !GetAtt MatchTrialsLambdaRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
      Environment:
        Variables:
          AURORA_CLUSTER_ENDPOINT: !GetAtt AuroraCluster.Endpoint.Address
          AURORA_READER_ENDPOINT: !GetAtt AuroraCluster.ReadEndpoint.Address
          DB_NAME: trials_db
          DB_SECRET_ARN: !Ref DBSecret
          DB_PORT: '5432'
          BEDROCK_MODEL_ID: anthropic.claude-3-sonnet-20240229-v1:0
      Tracing: Active
      Tags:
        Name: !Sub ${Environment}-vitalmatch-match-trials
        Environment: !Ref Environment

  # CloudWatch Log Group for Match Trials Lambda
  MatchTrialsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-vitalmatch-match-trials
      RetentionInDays: 30

  # CloudWatch Alarm for Match Trials Errors
  # CloudWatch Alarm for Match Trials Error Rate
  MatchTrialsErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Environment}-vitalmatch-match-trials-error-rate
      AlarmDescription: Alert when match-trials Lambda error rate exceeds 5%
      Metrics:
        - Id: errors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref MatchTrialsFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: invocations
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref MatchTrialsFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: error_rate
          Expression: "(errors / invocations) * 100"
          Label: Error Rate (%)
          ReturnData: true
      ComparisonOperator: GreaterThanThreshold
      Threshold: 5
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SystemAlertTopic

  # CloudWatch Alarm for Match Trials Duration
  MatchTrialsDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Environment}-vitalmatch-match-trials-duration
      AlarmDescription: Alert when match-trials Lambda duration exceeds 15 seconds
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 15000  # 15 seconds in milliseconds
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref MatchTrialsFunction
      AlarmActions:
        - !Ref SystemAlertTopic
      TreatMissingData: notBreaching

  # IAM Role for Data Ingestion Lambda (NOT in VPC)
  DataIngestionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Environment}-vitalmatch-data-ingestion-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: DataIngestionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # RDS IAM authentication (connects directly to RDS, not proxy)
              - Effect: Allow
                Action:
                  - rds-db:connect
                Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:*/*
              # SNS notifications
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref SystemAlertTopic
              # CloudWatch metrics
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
              # Secrets Manager (for database credentials)
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DBSecret
              # Parameter Store (for configuration)
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Environment}/vitalmatch/*

  # Data Ingestion Lambda Function (NOT in VPC - has internet access)
  DataIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-vitalmatch-data-ingestion
      CodeUri: backend/
      Handler: ingest_trials.lambda_handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 300
      Role: !GetAtt DataIngestionLambdaRole.Arn
      # NO VpcConfig - Lambda runs outside VPC with internet access
      Environment:
        Variables:
          AURORA_CLUSTER_ENDPOINT: !GetAtt AuroraCluster.Endpoint.Address
          DB_NAME: trials_db
          DB_SECRET_ARN: !Ref DBSecret
          DB_PORT: '5432'
          SNS_ALERT_TOPIC: !Ref SystemAlertTopic
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 2 * * ? *)
            Description: Daily trial data ingestion at 2 AM UTC
            Enabled: true
      Tracing: Active
      Tags:
        Name: !Sub ${Environment}-vitalmatch-data-ingestion
        Environment: !Ref Environment

  # CloudWatch Log Group for Data Ingestion Lambda
  DataIngestionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-vitalmatch-data-ingestion
      RetentionInDays: 30

  # CloudWatch Alarm for Data Ingestion Errors
  DataIngestionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Environment}-vitalmatch-data-ingestion-errors
      AlarmDescription: Alert when data ingestion Lambda has errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref DataIngestionFunction
      AlarmActions:
        - !Ref SystemAlertTopic
      TreatMissingData: notBreaching

  # CloudWatch Alarm for Data Ingestion Duration
  DataIngestionDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Environment}-vitalmatch-data-ingestion-duration
      AlarmDescription: Alert when data ingestion takes too long
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 270000  # 270 seconds (90% of 300 second timeout)
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref DataIngestionFunction
      AlarmActions:
        - !Ref SystemAlertTopic
      TreatMissingData: notBreaching

  # ============================================================================
  # RDS CloudWatch Alarms (Task 12.2)
  # ============================================================================

  # ============================================================================
  # Aurora CloudWatch Alarms
  # ============================================================================

  # CloudWatch Alarm for Aurora Serverless v2 Capacity
  AuroraCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Environment}-vitalmatch-aurora-capacity-high
      AlarmDescription: Alert when Aurora capacity reaches 0.9 ACU (90% of max)
      MetricName: ServerlessDatabaseCapacity
      Namespace: AWS/RDS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0.9
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBClusterIdentifier
          Value: !Ref AuroraCluster
      AlarmActions:
        - !Ref SystemAlertTopic
      TreatMissingData: notBreaching

  # CloudWatch Alarm for Aurora CPU Utilization
  AuroraCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Environment}-vitalmatch-aurora-cpu-high
      AlarmDescription: Alert when Aurora CPU utilization exceeds 80%
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBClusterIdentifier
          Value: !Ref AuroraCluster
      AlarmActions:
        - !Ref SystemAlertTopic
      TreatMissingData: notBreaching

  # CloudWatch Alarm for Aurora Database Connections
  AuroraConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Environment}-vitalmatch-aurora-connections-high
      AlarmDescription: Alert when Aurora database connections are high
      MetricName: DatabaseConnections
      Namespace: AWS/RDS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBClusterIdentifier
          Value: !Ref AuroraCluster
      AlarmActions:
        - !Ref SystemAlertTopic
      TreatMissingData: notBreaching

  # CloudWatch Alarm for Aurora Read Latency
  AuroraReadLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Environment}-vitalmatch-aurora-read-latency-high
      AlarmDescription: Alert when Aurora read latency is high
      MetricName: ReadLatency
      Namespace: AWS/RDS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0.1  # 100ms in seconds
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBClusterIdentifier
          Value: !Ref AuroraCluster
      AlarmActions:
        - !Ref SystemAlertTopic
      TreatMissingData: notBreaching

  # CloudWatch Alarm for Aurora Write Latency
  AuroraWriteLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Environment}-vitalmatch-aurora-write-latency-high
      AlarmDescription: Alert when Aurora write latency is high
      MetricName: WriteLatency
      Namespace: AWS/RDS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0.1  # 100ms in seconds
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBClusterIdentifier
          Value: !Ref AuroraCluster
      AlarmActions:
        - !Ref SystemAlertTopic
      TreatMissingData: notBreaching

  # ============================================================================
  # API Gateway (Task 8)
  # ============================================================================

  # CloudWatch Log Group for API Gateway
  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${Environment}-vitalmatch-api
      RetentionInDays: 30

  # IAM Role for API Gateway Logging
  ApiGatewayLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  # API Gateway Account (for CloudWatch logging)
  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayLoggingRole.Arn

  # REST API
  TrialMatcherAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${Environment}-vitalmatch-api
      Description: VitalMatch Clinical Trial Matcher API
      EndpointConfiguration:
        Types:
          - REGIONAL
      Policy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: execute-api:Invoke
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-api
        - Key: Environment
          Value: !Ref Environment

  # Request Model for Patient Profile
  PatientProfileModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref TrialMatcherAPI
      ContentType: application/json
      Name: PatientProfile
      Description: Patient profile request model
      Schema:
        $schema: 'http://json-schema.org/draft-04/schema#'
        title: PatientProfile
        type: object
        required:
          - condition
          - age
          - gender
          - location
        properties:
          condition:
            type: string
            minLength: 1
            description: Medical condition
          age:
            type: integer
            minimum: 0
            maximum: 120
            description: Patient age
          gender:
            type: string
            enum:
              - Male
              - Female
              - Other
              - Prefer not to say
            description: Patient gender
          location:
            type: string
            minLength: 1
            description: Patient location (city, state)
          distance_miles:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
            description: Search radius in miles
          medical_history:
            type: string
            description: Patient medical history

  # Response Model for Match Results
  MatchResultsModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref TrialMatcherAPI
      ContentType: application/json
      Name: MatchResults
      Description: Trial match results response model
      Schema:
        $schema: 'http://json-schema.org/draft-04/schema#'
        title: MatchResults
        type: object
        properties:
          matches:
            type: array
            items:
              type: object
              properties:
                trial_id:
                  type: string
                title:
                  type: string
                match_score:
                  type: number
                explanation:
                  type: string
                key_criteria:
                  type: array
                  items:
                    type: string
          total_trials_considered:
            type: integer
          hard_filtered_count:
            type: integer
          processing_time_ms:
            type: integer

  # Error Response Model
  ErrorModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref TrialMatcherAPI
      ContentType: application/json
      Name: ErrorResponse
      Description: Error response model
      Schema:
        $schema: 'http://json-schema.org/draft-04/schema#'
        title: Error
        type: object
        properties:
          error:
            type: string
          message:
            type: string

  # Request Validator
  RequestValidator:
    Type: AWS::ApiGateway::RequestValidator
    Properties:
      RestApiId: !Ref TrialMatcherAPI
      Name: !Sub ${Environment}-request-validator
      ValidateRequestBody: true
      ValidateRequestParameters: true

  # /match-trials Resource
  MatchTrialsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref TrialMatcherAPI
      ParentId: !GetAtt TrialMatcherAPI.RootResourceId
      PathPart: match-trials

  # POST /match-trials Method
  MatchTrialsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TrialMatcherAPI
      ResourceId: !Ref MatchTrialsResource
      HttpMethod: POST
      AuthorizationType: NONE
      RequestValidatorId: !Ref RequestValidator
      RequestModels:
        application/json: !Ref PatientProfileModel
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: !Ref MatchResultsModel
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
        - StatusCode: 400
          ResponseModels:
            application/json: !Ref ErrorModel
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
        - StatusCode: 500
          ResponseModels:
            application/json: !Ref ErrorModel
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MatchTrialsFunction.Arn}/invocations
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"

  # OPTIONS /match-trials Method (for CORS preflight)
  MatchTrialsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TrialMatcherAPI
      ResourceId: !Ref MatchTrialsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
            ResponseTemplates:
              application/json: ''

  # Lambda Permission for API Gateway
  MatchTrialsApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MatchTrialsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TrialMatcherAPI}/*/*/*

  # API Gateway Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - MatchTrialsPostMethod
      - MatchTrialsOptionsMethod
    Properties:
      RestApiId: !Ref TrialMatcherAPI
      Description: !Sub ${Environment} deployment

  # Dev Stage
  DevStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref TrialMatcherAPI
      DeploymentId: !Ref ApiDeployment
      StageName: dev
      Description: Development stage
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
          ThrottlingBurstLimit: 2000
          ThrottlingRateLimit: 1000
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '$context.requestId $context.extendedRequestId $context.identity.sourceIp $context.requestTime $context.httpMethod $context.routeKey $context.status $context.protocol $context.responseLength'
      Variables:
        environment: dev
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-api-dev
        - Key: Stage
          Value: dev

  # Staging Stage
  StagingStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref TrialMatcherAPI
      DeploymentId: !Ref ApiDeployment
      StageName: staging
      Description: Staging stage
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
          ThrottlingBurstLimit: 2000
          ThrottlingRateLimit: 1000
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '$context.requestId $context.extendedRequestId $context.identity.sourceIp $context.requestTime $context.httpMethod $context.routeKey $context.status $context.protocol $context.responseLength'
      Variables:
        environment: staging
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-api-staging
        - Key: Stage
          Value: staging

  # Production Stage
  ProdStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref TrialMatcherAPI
      DeploymentId: !Ref ApiDeployment
      StageName: prod
      Description: Production stage
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: ERROR
          DataTraceEnabled: false
          MetricsEnabled: true
          ThrottlingBurstLimit: 2000
          ThrottlingRateLimit: 1000
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '$context.requestId $context.extendedRequestId $context.identity.sourceIp $context.requestTime $context.httpMethod $context.routeKey $context.status $context.protocol $context.responseLength'
      Variables:
        environment: prod
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-api-prod
        - Key: Stage
          Value: prod

  # CloudWatch Alarm for API Gateway 4XX Errors
  ApiGateway4XXAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Environment}-vitalmatch-api-4xx-errors
      AlarmDescription: Alert when API Gateway 4XX error rate is high
      MetricName: 4XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiName
          Value: !Sub ${Environment}-vitalmatch-api
        - Name: Stage
          Value: !Ref Environment
      AlarmActions:
        - !Ref SystemAlertTopic
      TreatMissingData: notBreaching

  # CloudWatch Alarm for API Gateway 5XX Errors
  ApiGateway5XXAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Environment}-vitalmatch-api-5xx-errors
      AlarmDescription: Alert when API Gateway 5XX error rate is high
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiName
          Value: !Sub ${Environment}-vitalmatch-api
        - Name: Stage
          Value: !Ref Environment
      AlarmActions:
        - !Ref SystemAlertTopic
      TreatMissingData: notBreaching

  # CloudWatch Alarm for API Gateway Latency
  ApiGatewayLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Environment}-vitalmatch-api-latency
      AlarmDescription: Alert when API Gateway latency exceeds 3 seconds
      MetricName: Latency
      Namespace: AWS/ApiGateway
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3000  # 3 seconds in milliseconds
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiName
          Value: !Sub ${Environment}-vitalmatch-api
        - Name: Stage
          Value: !Ref Environment
      AlarmActions:
        - !Ref SystemAlertTopic
      TreatMissingData: notBreaching

  # ============================================================================
  # S3 Bucket for Static Website Hosting (Task 11.1)
  # ============================================================================

  # S3 Bucket for Frontend Static Website
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${Environment}-vitalmatch-frontend-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html  # For SPA routing
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            MaxAge: 3600
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-frontend
        - Key: Environment
          Value: !Ref Environment

  # S3 Bucket Policy for CloudFront Access
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  # ============================================================================
  # CloudFront Distribution (Task 11.2)
  # ============================================================================

  # CloudFront Origin Access Control for S3
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${Environment}-vitalmatch-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
        Description: Origin Access Control for VitalMatch Frontend S3 Bucket

  # ACM Certificate for CloudFront (must be in us-east-1)
  # Note: For production, create certificate manually in us-east-1 and reference it
  # This is a placeholder - actual certificate should be created separately
  # CloudFrontCertificate:
  #   Type: AWS::CertificateManager::Certificate
  #   Properties:
  #     DomainName: !Sub ${Environment}.vitalmatch.example.com
  #     ValidationMethod: DNS
  #     Tags:
  #       - Key: Name
  #         Value: !Sub ${Environment}-vitalmatch-cloudfront-cert

  # Cache Policy for Static Assets
  StaticAssetsCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${Environment}-vitalmatch-static-assets-cache
        Comment: Cache policy for static assets (CSS, JS, images)
        DefaultTTL: 86400  # 1 day
        MaxTTL: 31536000  # 1 year
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # Cache Policy for HTML (shorter TTL for SPA)
  HTMLCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${Environment}-vitalmatch-html-cache
        Comment: Cache policy for HTML files with shorter TTL
        DefaultTTL: 300  # 5 minutes
        MaxTTL: 3600  # 1 hour
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # Response Headers Policy for Security
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${Environment}-vitalmatch-security-headers
        Comment: Security headers for VitalMatch frontend
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
        CorsConfig:
          AccessControlAllowOrigins:
            Items:
              - '*'
          AccessControlAllowHeaders:
            Items:
              - '*'
          AccessControlAllowMethods:
            Items:
              - GET
              - HEAD
              - OPTIONS
          AccessControlAllowCredentials: false
          OriginOverride: true

  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub ${Environment} VitalMatch Clinical Trial Matcher Frontend
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100  # Use only North America and Europe edge locations
        
        # Origins
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOriginAccessControl
            S3OriginConfig: {}
        
        # Default Cache Behavior (for HTML and root)
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          CachePolicyId: !Ref HTMLCachePolicy
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        
        # Cache Behaviors for Static Assets
        CacheBehaviors:
          # CSS files
          - PathPattern: '*.css'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

          # JavaScript files
          - PathPattern: '*.js'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

          # Image files
          - PathPattern: '*.jpg'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

          - PathPattern: '*.jpeg'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

          - PathPattern: '*.png'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

          - PathPattern: '*.gif'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

          - PathPattern: '*.svg'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

          - PathPattern: '*.ico'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

          # Font files
          - PathPattern: '*.woff'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

          - PathPattern: '*.woff2'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

          - PathPattern: '*.ttf'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

          - PathPattern: '*.eot'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

          # Static assets directory
          - PathPattern: '/static/*'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

          # Assets directory
          - PathPattern: '/assets/*'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy

        # Custom Error Responses for SPA Routing
        CustomErrorResponses:
          # Redirect 404 to index.html for client-side routing
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
          # Redirect 403 to index.html for client-side routing
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300

        # Default Root Object
        DefaultRootObject: index.html

        # Logging Configuration (optional)
        Logging:
          Bucket: !GetAtt CloudFrontLogsBucket.DomainName
          Prefix: !Sub ${Environment}-cloudfront-logs/
          IncludeCookies: false

        # SSL/TLS Configuration
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          # For custom domain, uncomment and configure:
          # AcmCertificateArn: !Ref CloudFrontCertificate
          # SslSupportMethod: sni-only
          # MinimumProtocolVersion: TLSv1.2_2021

      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-cloudfront
        - Key: Environment
          Value: !Ref Environment

  # S3 Bucket for CloudFront Access Logs
  CloudFrontLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${Environment}-vitalmatch-cloudfront-logs-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-vitalmatch-cloudfront-logs
        - Key: Environment
          Value: !Ref Environment

  # CloudFront Logs Bucket Policy
  CloudFrontLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudFrontLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontLogging
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:PutObject
            Resource: !Sub ${CloudFrontLogsBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

