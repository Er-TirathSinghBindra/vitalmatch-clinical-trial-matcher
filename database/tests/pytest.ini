[pytest]
# Pytest configuration for database schema validation tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for organizing tests
markers =
    table: Tests for table structure and creation
    constraints: Tests for database constraints
    indexes: Tests for index existence and configuration
    performance: Tests for index performance
    datatypes: Tests for data type handling
    triggers: Tests for trigger functionality
    sample_data: Tests for sample data validation

# Test paths
testpaths = .

# Minimum Python version
minversion = 3.11
